name: Verify PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Repository Verification & Hygiene
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: "test"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Scripts
        run: |
          for script in scripts/*; do
            if [ -f "$script" ] && head -n1 "$script" | grep -qE '^#!/(bin|usr/bin)/(env\s+)?(bash|sh)'; then
              bash -n "$script"
            fi
          done

      - name: Verify No Secrets Committed
        run: |
          if git grep -I -i -E "BEGIN (RSA|OPENSSH|DSA|EC) PRIVATE KEY" .; then
            echo "Private key detected in repository!"
            exit 1
          fi
          echo "Secret scan passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Test Database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test
